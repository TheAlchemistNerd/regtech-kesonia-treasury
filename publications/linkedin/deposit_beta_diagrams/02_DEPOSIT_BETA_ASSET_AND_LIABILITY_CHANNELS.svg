<text x="108" y="1378" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#17212b">Review uncertainty, affordability, liquidity, capital and limits before executing approved actions.</text>
<text x="80" y="1447" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#526478">PD = probability of default; LGD = loss given default; EAD = exposure at default.</text>
